<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/variable.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/shop.css">
    <title>shop - SHOP.CO</title>
</head>

<body>
    <header></header>
    <main>
        <nav class="breadcrumb">
            <a href="../index.html">home</a>
            <span>></span>
            <span class="breadcrumb-current">Shop</span>
        </nav>

        <div class="shop-layout">
            <aside class="filters-sidebar">
                <h2>Filters</h2>
                <!-- category -->
                <div class="filter-group">
                    <h3>category</h3>
                    <ul class="filter-list" id="category-filter">
                        <li><button type="button" data-category="t-shirts">T-Shirts</button></li>
                        <li><button type="button" data-category="jeans">Jeans</button></li>
                        <li><button type="button" data-category="shirts">Shirts</button></li>
                        <li><button type="button" data-category="shorts">shorts</button></li>
                        <li><button type="button" data-category="hoodies">hoodie</button></li>
                    </ul>
                </div>

                <!-- colors -->
                <div class="filter-group">
                    <h3>Colors</h3>
                    <div class="color-filter-list" id="color-filter">
                        <label class="color-swatch">
                            <input type="checkbox" value="black" hidden>
                            <span style="background-color: black;"></span>
                        </label>
                        <label class="color-swatch">
                            <input type="checkbox" value="white" hidden>
                            <span style="background-color: white;"></span>
                        </label>
                        <label class="color-swatch">
                            <input type="checkbox" value="blue" hidden>
                            <span style="background-color: blue;"></span>
                        </label>
                        <label class="color-swatch">
                            <input type="checkbox" value="red" hidden>
                            <span style="background-color: red;"></span>
                        </label>
                        <label class="color-swatch">
                            <input type="checkbox" value="gray" hidden>
                            <span style="background-color: gray;"></span>
                        </label>
                    </div>
                </div>
                <!-- size -->
                <div class="filter-group">
                    <h3>Size</h3>
                    <div class="size-filter-list" id="size-filter">
                        <label class="size-swatch"><input type="checkbox" value="S" hidden><span>S</span></label>
                        <label class="size-swatch"><input type="checkbox" value="M" hidden><span>M</span></label>
                        <label class="size-swatch"><input type="checkbox" value="L" hidden><span>L</span></label>
                        <label class="size-swatch"><input type="checkbox" value="XL" hidden><span>XL</span></label>
                    </div>
                </div>
                <!-- styles -->
                <div class="filter-group">
                    <h3>Dress Style</h3>
                    <ul class="filter-list" id="style-filter">
                        <li><button type="button" data-style="casual">Casual</button></li>
                        <li><button type="button" data-style="formal">Formal</button></li>
                        <li><button type="button" data-style="party">Party</button></li>
                        <li><button type="button" data-style="gym">Gym</button></li>
                    </ul>
                </div>
            </aside>
            <div class="product-area">

                <div class="products-area-header">
                    <h1 class="product-title">All product</h1>
                    <select name="" id="" class="sort-select">
                        <option value="popular">Most Popular</option>
                        <option value="low-price">Lowest Price</option>
                        <option value="high-price">Highest Price</option>
                        <option value="high-rating">Highest Rating</option>
                    </select>
                </div>
                <div class="products-grid" id="products-grid"></div>
            </div>

        </div>
    </main>
    <footer></footer>

    <script type="module" src="../assets/js/pages/shop.js"></script>
</body>

</html>
